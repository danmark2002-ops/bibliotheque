<style>
/* ============ Bibliothèque — styles ============ */
:root {
  --font-display: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --font-read: 'Literata', 'Iowan Old Style', Georgia, serif;
  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  /* Décor « Noyer » (par défaut) */
  --room: #140f0b;
  --room-2: #1d1610;
  --lamp: rgba(255, 196, 120, .16);
  --ink: #f3e9da;
  --ink-2: #bfae98;
  --ink-3: #8a7a66;
  --brass: #d4ab6a;
  --brass-2: #b8894a;
  --brass-ink: #241809;
  --glass: rgba(40, 30, 22, .62);
  --glass-line: rgba(255, 230, 200, .09);
  --panel: #1e1712;
  --panel-2: #271e17;
  --line: rgba(255, 230, 200, .1);
  --case-back: #24170f;
  --case-back-2: #1a110b;
  --plank-top: #8b5a35;
  --plank-mid: #6d4427;
  --plank-front: #4d2f1a;
  --plank-edge: #a8764c;
  --side: #3a2516;
  --danger: #e2735e;
  --ok: #8fbf7f;
  color-scheme: dark;
}
:root[data-decor="chene"] {
  --room: #efe7dc;
  --room-2: #e6dbcc;
  --lamp: rgba(255, 255, 255, .7);
  --ink: #2b2017;
  --ink-2: #6a5847;
  --ink-3: #978571;
  --brass: #9a6a2c;
  --brass-2: #7f561f;
  --brass-ink: #fff8ee;
  --glass: rgba(255, 252, 247, .72);
  --glass-line: rgba(80, 50, 20, .1);
  --panel: #fbf7f1;
  --panel-2: #f2eadf;
  --line: rgba(80, 50, 20, .12);
  --case-back: #d9c3a3;
  --case-back-2: #cbb18e;
  --plank-top: #e3c79f;
  --plank-mid: #cfa977;
  --plank-front: #b48b58;
  --plank-edge: #f0dcbc;
  --side: #c39d6b;
  color-scheme: light;
}


/* Décors supplémentaires : chaque bibliothèque peut avoir le sien */
:root[data-decor="acajou"] {
  --room: #170c0a; --room-2: #22110d; --lamp: rgba(255, 150, 110, .15);
  --ink: #f5e6dc; --ink-2: #c9a798; --ink-3: #93766a;
  --brass: #e0a07a; --brass-2: #c27b55; --brass-ink: #2a120a;
  --glass: rgba(46, 22, 17, .62); --panel: #221310; --panel-2: #2d1914;
  --case-back: #2a120d; --case-back-2: #1e0c08;
  --plank-top: #8e3b28; --plank-mid: #70291b; --plank-front: #4f1b11; --plank-edge: #b25a40; --side: #44190f;
}
:root[data-decor="ebene"] {
  --room: #0d0d10; --room-2: #15151a; --lamp: rgba(190, 200, 255, .1);
  --ink: #ecebf2; --ink-2: #aeadbb; --ink-3: #7b7a88;
  --brass: #c9c3b0; --brass-2: #a39d8a; --brass-ink: #141418;
  --glass: rgba(28, 28, 34, .66); --glass-line: rgba(220, 220, 255, .08); --panel: #17171c; --panel-2: #1f1f26; --line: rgba(220, 220, 255, .09);
  --case-back: #18181d; --case-back-2: #101014;
  --plank-top: #3b3b44; --plank-mid: #2a2a31; --plank-front: #1b1b20; --plank-edge: #5a5a66; --side: #222228;
}
:root[data-decor="ardoise"] {
  --room: #0e1419; --room-2: #141d24; --lamp: rgba(150, 200, 240, .13);
  --ink: #e6eef3; --ink-2: #a2b4c0; --ink-3: #718491;
  --brass: #8fc1d9; --brass-2: #6aa1bb; --brass-ink: #0c1a22;
  --glass: rgba(22, 34, 43, .64); --glass-line: rgba(190, 225, 255, .09); --panel: #15202a; --panel-2: #1b2934; --line: rgba(190, 225, 255, .1);
  --case-back: #172530; --case-back-2: #101b23;
  --plank-top: #4f6a7c; --plank-mid: #3b5262; --plank-front: #283b48; --plank-edge: #6f8ea2; --side: #24343f;
}
:root[data-decor="olivier"] {
  --room: #11120b; --room-2: #191a10; --lamp: rgba(220, 230, 140, .13);
  --ink: #eef0dc; --ink-2: #b7ba98; --ink-3: #868a68;
  --brass: #c8c46a; --brass-2: #a8a44c; --brass-ink: #1c1c08;
  --glass: rgba(32, 34, 20, .62); --panel: #1b1d11; --panel-2: #242617; --line: rgba(240, 240, 190, .1);
  --case-back: #1f2213; --case-back-2: #16180d;
  --plank-top: #767a3e; --plank-mid: #5d6130; --plank-front: #414420; --plank-edge: #979b58; --side: #33361a;
}
:root[data-decor="bouleau"] {
  --room: #eeeee9; --room-2: #e4e3dc; --lamp: rgba(255, 255, 255, .75);
  --ink: #22242a; --ink-2: #5d6068; --ink-3: #8e9098;
  --brass: #4f6f86; --brass-2: #3f5a6e; --brass-ink: #f6f8fa;
  --glass: rgba(255, 255, 252, .74); --glass-line: rgba(30, 40, 50, .1); --panel: #fbfbf8; --panel-2: #f0efe9; --line: rgba(30, 40, 50, .12);
  --case-back: #d8d4c8; --case-back-2: #cac5b6;
  --plank-top: #ece7da; --plank-mid: #d9d2c0; --plank-front: #bdb5a1; --plank-edge: #f7f4ec; --side: #c6bfac;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--room);
  color: var(--ink);
  font: 15px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
.boot { min-height: 100vh; display: grid; place-items: center; }
.boot-mark, .join-mark { font-size: 42px; color: var(--brass); animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .35; transform: scale(.94); } }

/* ---------- Pièce ---------- */
.room {
  min-height: 100vh;
  background:
    radial-gradient(1100px 520px at 50% -120px, var(--lamp), transparent 70%),
    radial-gradient(900px 600px at 50% 120%, rgba(0,0,0,.35), transparent 70%),
    var(--room);
  padding: max(18px, env(safe-area-inset-top)) 16px 120px;
}
.wrap { max-width: 1180px; margin: 0 auto; }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 10px 0 26px; flex-wrap: wrap; }
.brand h1 {
  font: italic 600 clamp(30px, 6vw, 48px)/1.02 var(--font-display);
  letter-spacing: -.01em; margin: 0;
}
.brand p { margin: 6px 0 0; color: var(--ink-3); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px;
  border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  font-weight: 500; font-size: 14px; transition: transform .15s, background .2s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: linear-gradient(180deg, var(--brass), var(--brass-2)); color: var(--brass-ink); border-color: transparent; box-shadow: 0 6px 18px -6px rgba(212,171,106,.6); }
.btn.icon { width: 40px; padding: 0; justify-content: center; }
.btn.on { outline: 2px solid var(--brass); }
.btn.danger { color: var(--danger); }

/* ---------- Reprendre ---------- */
.hero {
  display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center;
  padding: 18px; margin-bottom: 30px; border-radius: 22px;
  background: linear-gradient(120deg, var(--glass), transparent 120%);
  border: 1px solid var(--glass-line);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
}
.hero .mini { width: 92px; transform: perspective(600px) rotateY(14deg); }
.hero small { color: var(--brass); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.hero h2 { font: 600 clamp(20px, 3.4vw, 28px)/1.15 var(--font-display); margin: 4px 0 2px; }
.hero .by { color: var(--ink-2); margin: 0 0 12px; }
.bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; max-width: 340px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brass-2), var(--brass)); border-radius: 4px; }
.hero .meta { font-size: 12px; color: var(--ink-3); margin: 6px 0 12px; }
.hero .row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Bibliothèque (meuble) ---------- */
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
.search {
  flex: 1; max-width: 360px; height: 38px; border-radius: 12px; padding: 0 14px;
  border: 1px solid var(--glass-line); background: var(--glass); outline: none;
}
.hint { color: var(--ink-3); font-size: 13px; }

.case {
  position: relative; border-radius: 10px; padding: 14px 14px 4px;
  background:
    linear-gradient(90deg, rgba(0,0,0,.35), transparent 6%, transparent 94%, rgba(0,0,0,.35)),
    repeating-linear-gradient(92deg, rgba(255,255,255,.015) 0 3px, transparent 3px 11px),
    linear-gradient(180deg, var(--case-back), var(--case-back-2));
  box-shadow: inset 0 0 0 10px var(--side), inset 0 0 0 11px rgba(0,0,0,.25), inset 0 30px 60px -20px rgba(0,0,0,.6), 0 30px 60px -30px rgba(0,0,0,.7);
}
.shelf { position: relative; padding: 26px 18px 0; }
.shelf-books {
  display: grid; gap: clamp(10px, 2.4vw, 26px); align-items: end; min-height: 120px;
  position: relative; z-index: 2;
}
.plank {
  position: relative; height: 22px; margin: 0 -18px; z-index: 1;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 9px, rgba(255,255,255,.04) 9px 10px, transparent 10px 23px),
    linear-gradient(180deg, var(--plank-edge) 0, var(--plank-top) 2px, var(--plank-mid) 9px, var(--plank-front) 100%);
  border-radius: 2px;
  box-shadow: 0 14px 18px -8px rgba(0,0,0,.65), 0 -1px 0 rgba(0,0,0,.25);
}
.plank::after { /* ombre portée sur le fond */
  content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 26px;
  background: linear-gradient(180deg, rgba(0,0,0,.45), transparent);
}

.book {
  position: relative; border: 0; padding: 0; background: none; display: block; width: 100%;
  transform-origin: 50% 100%; transition: transform .35s cubic-bezier(.2,.8,.2,1), filter .35s;
  perspective: 900px;
}
.book:hover, .book:focus-visible { transform: translateY(-10px); outline: none; }
.book:hover .cover, .book:focus-visible .cover { transform: rotateY(-14deg); box-shadow: 10px 16px 22px -6px rgba(0,0,0,.6); }
.book:active { transform: translateY(-4px) scale(.98); }
.cover {
  position: relative; border-radius: 2px 5px 5px 2px; overflow: hidden;
  transform-origin: 0 50%; transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
  box-shadow: 4px 6px 12px -3px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.4);
  background: var(--c, #555);
}
.cover img { display: block; width: 100%; height: auto; max-height: 340px; object-fit: cover; }
.cover::before { /* dos du livre */
  content: ''; position: absolute; inset: 0 auto 0 0; width: 9%; z-index: 2;
  background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(255,255,255,.18) 40%, rgba(0,0,0,.12) 70%, transparent);
}
.cover::after { /* reflet */
  content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,.16), transparent 35%, transparent 70%, rgba(0,0,0,.12));
}
/* Couverture générée (texte) */
.gen {
  aspect-ratio: 2 / 3; display: flex; flex-direction: column; justify-content: space-between;
  padding: 14% 12% 12% 16%; color: #f6ecd8; text-align: left;
  background:
    radial-gradient(120% 80% at 80% 0%, rgba(255,255,255,.14), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.04) 0 1px, transparent 1px 3px),
    var(--c);
}
.gen .t { font: 600 clamp(11px, 1.9vw, 17px)/1.12 var(--font-display); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
.gen .rule { width: 34%; height: 1px; background: currentColor; opacity: .6; margin: 8% 0; }
.gen .a { font: italic 400 clamp(9px, 1.4vw, 12px)/1.2 var(--font-display); opacity: .85; }
.gen .orn { font-size: clamp(10px, 1.6vw, 14px); opacity: .55; }
.ribbon {
  position: absolute; z-index: 3; top: 0; right: 10%; width: 14%; min-width: 12px; height: 18%;
  background: linear-gradient(180deg, #d4ab6a, #b8894a);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
  box-shadow: 0 2px 4px rgba(0,0,0,.3);
}
.pct {
  position: absolute; z-index: 3; left: 50%; bottom: -19px; transform: translateX(-50%);
  font-size: 10px; font-weight: 600; color: var(--ink-2); letter-spacing: .04em; white-space: nowrap;
}
.status-pill {
  position: absolute; z-index: 4; inset: auto 6px 6px 6px; text-align: center; font-size: 10px;
  padding: 3px 4px; border-radius: 6px; background: rgba(0,0,0,.65); color: #fff;
}
.organize .book { animation: wiggle .5s ease-in-out infinite alternate; }
.organize .book:nth-child(2n) { animation-delay: .2s; }
@keyframes wiggle { from { transform: rotate(-1deg); } to { transform: rotate(1deg); } }
.organize .book::after {
  content: '✎'; position: absolute; top: -10px; left: -8px; z-index: 5; width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; font-size: 13px; background: var(--brass); color: var(--brass-ink); box-shadow: 0 2px 6px rgba(0,0,0,.4);
}

.empty { text-align: center; padding: 40px 16px 30px; position: relative; z-index: 3; }
.empty h3 { font: italic 600 26px/1.2 var(--font-display); margin: 0 0 6px; }
.empty p { color: var(--ink-2); margin: 0 0 16px; }

.dropzone {
  position: fixed; inset: 0; z-index: 90; display: none; place-items: center;
  background: rgba(10, 7, 5, .7); backdrop-filter: blur(6px);
  font: italic 600 28px var(--font-display); color: var(--brass);
}
.dropzone.show { display: grid; }
.dropzone div { border: 2px dashed var(--brass); border-radius: 24px; padding: 60px 50px; }

/* Téléversement */
.uploads { position: fixed; z-index: 70; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(320px, calc(100vw - 32px)); }
.up { padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.4); font-size: 13px; }
.up b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.up .bar { margin-top: 8px; max-width: none; }

/* ---------- Feuilles / panneaux ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(8, 5, 3, .55); backdrop-filter: blur(4px); display: grid; place-items: end center; animation: fade .2s; }
@media (min-width: 720px) { .scrim { place-items: center; } }
@keyframes fade { from { opacity: 0; } }
.sheet {
  width: min(560px, 100%); max-height: 92vh; overflow: auto; background: var(--panel); color: var(--ink);
  border-radius: 24px 24px 0 0; border: 1px solid var(--line); padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
  animation: rise .3s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -20px 60px rgba(0,0,0,.4);
}
.sheet.wide { width: min(980px, 100%); }
@media (min-width: 720px) { .sheet { border-radius: 24px; } }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.sheet h2 { font: italic 600 26px/1.1 var(--font-display); margin: 0; }
.sheet h3 { font: 600 13px var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 26px 0 10px; }
.field { display: grid; gap: 6px; margin-bottom: 12px; font-size: 13px; color: var(--ink-2); }
.field input, .field select {
  height: 44px; border-radius: 12px; padding: 0 14px; border: 1px solid var(--line); background: var(--panel-2); outline: none; font-size: 15px;
}
.field input:focus { border-color: var(--brass); }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); margin-bottom: 12px; }
.seg button { border: 0; background: none; padding: 8px 14px; border-radius: 9px; font-size: 13px; color: var(--ink-2); }
.seg button.sel { background: var(--panel); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; }
.swatches button.sel { border-color: var(--ink); }
.list { display: grid; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
.item .grow { flex: 1; min-width: 0; }
.item .grow b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .grow span { font-size: 12px; color: var(--ink-3); }
.item.off { opacity: .5; }
.muted { color: var(--ink-3); font-size: 13px; }
.linkbox { font: 12px ui-monospace, monospace; word-break: break-all; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); border: 1px dashed var(--line); margin: 8px 0; }

/* ---------- Tableau de bord ---------- */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 600px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile { padding: 14px; border-radius: 16px; background: var(--panel-2); border: 1px solid var(--line); }
.tile b { display: block; font: 600 28px/1 var(--font-display); }
.tile span { font-size: 12px; color: var(--ink-3); }
.feed { display: grid; gap: 2px; }
.feed div { display: flex; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
.feed time { color: var(--ink-3); font-size: 12px; min-width: 118px; font-variant-numeric: tabular-nums; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; font: 600 16px var(--font-display); color: #fff; }
.reader-card { cursor: pointer; transition: border-color .2s; }
.reader-card:hover { border-color: var(--brass); }
.stat-row { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); text-align: right; }
.stat-row b { display: block; font-size: 16px; color: var(--ink); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .bar { margin-top: 6px; max-width: 160px; }
.visit { padding: 10px 12px; border-left: 2px solid var(--brass); margin: 0 0 10px 6px; }
.visit b { font-weight: 600; }
.visit ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
.scroll-x { overflow-x: auto; }

/* ---------- Connexion ---------- */
.auth, .join-body { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(900px 500px at 50% -100px, var(--lamp), transparent 70%), var(--room); }
.auth-card, .join-card { width: min(400px, 100%); text-align: center; }
.auth-card h1, .join-card h1 { font: italic 600 40px/1.05 var(--font-display); margin: 10px 0 8px; }
.auth-card p, .join-card p { color: var(--ink-2); margin: 0 0 22px; }
.auth-card .field, .join-card label { text-align: left; }
.join-card label { display: grid; gap: 6px; margin-bottom: 12px; font-size: 13px; color: var(--ink-2); }
.join-card label span { color: var(--ink-3); }
.join-card input { height: 46px; border-radius: 12px; padding: 0 14px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); font-size: 15px; outline: none; }
.join-card button, .auth-card .btn.primary { width: 100%; height: 48px; justify-content: center; font-size: 15px; border-radius: 14px; margin-top: 6px; }
.join-card button { border: 0; background: linear-gradient(180deg, var(--brass), var(--brass-2)); color: var(--brass-ink); font-weight: 600; cursor: pointer; }
.join-err, .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 10px; }
.mini-shelf { display: flex; justify-content: center; align-items: flex-end; gap: 6px; height: 90px; }
.mini-shelf i { display: block; width: 18px; border-radius: 2px; box-shadow: inset -3px 0 0 rgba(0,0,0,.2); }
.mini-shelf + .plank { margin: 0 auto 26px; width: 180px; height: 10px; }

/* ---------- Lecteur ---------- */
.reader {
  --paper: #f6efe1; --paper-ink: #2c241b; --paper-2: #e9dfcb; --chrome: rgba(246,239,225,.86); --chrome-ink: #2c241b;
  position: fixed; inset: 0; z-index: 50; background: var(--paper); color: var(--paper-ink);
  display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.reader[data-theme="clair"] { --paper: #fdfcf9; --paper-ink: #1c1b19; --paper-2: #ecebe6; --chrome: rgba(253,252,249,.86); --chrome-ink: #1c1b19; }
.reader[data-theme="nuit"] { --paper: #121110; --paper-ink: #d9d2c5; --paper-2: #2a2724; --chrome: rgba(24,22,20,.88); --chrome-ink: #e8e1d4; }
.reader[data-theme="nuit"] .pdf-canvas { filter: invert(.88) hue-rotate(180deg) contrast(.9); }
.r-top, .r-bottom {
  position: absolute; left: 0; right: 0; z-index: 5; background: var(--chrome); color: var(--chrome-ink);
  backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
  transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s;
}
.r-top { top: 0; display: flex; align-items: center; gap: 8px; padding: max(10px, env(safe-area-inset-top)) 12px 10px; border-bottom: 1px solid rgba(0,0,0,.06); }
.r-top .ttl { flex: 1; min-width: 0; text-align: center; }
.r-top .ttl b { display: block; font: 600 15px/1.2 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-top .ttl span { font-size: 11px; opacity: .6; }
.r-bottom { bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(0,0,0,.06); }
.reader.immersive .r-top { transform: translateY(-110%); opacity: 0; }
.reader.immersive .r-bottom { transform: translateY(110%); opacity: 0; }
.rbtn { width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent; display: grid; place-items: center; color: inherit; }
.rbtn:hover { background: rgba(127,127,127,.14); }
.rbtn svg { width: 22px; height: 22px; }
.rbtn.on { color: var(--brass-2); }
.slider { display: flex; align-items: center; gap: 12px; font-size: 12px; opacity: .85; font-variant-numeric: tabular-nums; }
.slider input { flex: 1; accent-color: #b8894a; }

.stage { flex: 1; position: relative; overflow: hidden; perspective: 1600px; }
.page {
  position: absolute; inset: 0; overflow: auto; display: flex; justify-content: center; align-items: flex-start;
  padding: 70px 14px 90px; -webkit-overflow-scrolling: touch;
}
.page.pdf { align-items: center; }
.page { background: var(--paper); }
/* PDF : la feuille est posée sur un fond noir, comme dans Google Livres */
.reader.pdf-mode { background: #000; --chrome: rgba(14,14,14,.84); --chrome-ink: #ececec; }
.reader.pdf-mode .r-top, .reader.pdf-mode .r-bottom { border-color: rgba(255,255,255,.06); }
.reader.pdf-mode .page { background: #000; color: #bbb; }
.reader.pdf-mode .page.pdf:not(.zoom) { padding: 0; overflow: hidden; display: block; background: #fff; box-sizing: border-box; }
.reader.pdf-mode .page.pdf:not(.zoom) .pdf-canvas { box-shadow: none; border-radius: 0; }
.reader.pdf-mode .page.pdf:not(.zoom) .folio { display: none; }
.reader.pdf-mode[data-theme="nuit"] .page.pdf:not(.zoom) { background: #1b1b1b; }
/* Pli de page */
.curl-shade, .curl-flap, .curl-flap > div { position: absolute; inset: 0; pointer-events: none; }
.curl-shade { z-index: 2; overflow: hidden; }
.curl-flap { z-index: 4; filter: drop-shadow(0 0 7px rgba(0,0,0,.3)); }
.curl-flap > div { background: var(--paper); }
.reader.pdf-mode .curl-flap > div { background: #f4f4f2; }
.reader.pdf-mode[data-theme="nuit"] .curl-flap > div { background: #2a2a2a; }
.curl-shade i, .curl-flap i { position: absolute; height: 6000px; margin-top: -3000px; transform-origin: 0 50%; }
.curl-shade i { background: linear-gradient(to right, rgba(0,0,0,.34), rgba(0,0,0,.12) 45%, rgba(0,0,0,0)); }
.curl-flap i { background: linear-gradient(to right, rgba(0,0,0,.16), rgba(255,255,255,.3) 16%, rgba(255,255,255,.06) 55%, rgba(0,0,0,.1)); }
.pdf-canvas { display: block; max-width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.1); background: #fff; border-radius: 2px; }
.page.zoom { align-items: flex-start; justify-content: flex-start; }
.page.zoom .pdf-canvas { max-width: none; }
.prose {
  width: min(680px, 100%); font: 400 var(--fs, 19px)/1.72 var(--font-read); hyphens: auto; -webkit-hyphens: auto;
  text-align: justify; padding: 10px 6px 40px;
}
.prose p { margin: 0 0 1em; text-indent: 1.4em; }
.prose p:first-of-type { text-indent: 0; }
.prose .hd { font: 600 1.28em/1.3 var(--font-display); text-align: left; text-indent: 0; margin: 1.5em 0 .6em; letter-spacing: -.005em; }
.prose .hd:first-child { margin-top: .2em; }
.prose.first p:first-of-type::first-letter { float: left; font: 600 3.4em/.85 var(--font-display); padding: .08em .1em 0 0; color: #9a6a2c; }
.prose .s { transition: background .25s; border-radius: 3px; }
.prose .s.cur { background: rgba(212,171,106,.38); box-shadow: 0 0 0 2px rgba(212,171,106,.38); }
.folio { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font: italic 13px var(--font-display); opacity: .45; pointer-events: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font: italic 18px var(--font-display); opacity: .5; }
.tapzone { position: absolute; top: 60px; bottom: 80px; width: 22%; z-index: 3; }
.tapzone.l { left: 0; } .tapzone.r { right: 0; }

/* Lecteur audio */
.player {
  position: absolute; z-index: 6; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  width: min(520px, calc(100% - 24px)); border-radius: 22px; padding: 12px 14px;
  background: rgba(30, 24, 18, .9); color: #f3e9da; box-shadow: 0 20px 50px -10px rgba(0,0,0,.5);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  animation: rise .3s cubic-bezier(.2,.8,.2,1);
}
.reader.immersive .player { bottom: calc(18px + env(safe-area-inset-bottom)); }
.player .cap { font: italic 15px/1.4 var(--font-read); min-height: 2.8em; max-height: 4.2em; overflow: hidden; opacity: .92; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.player .ctl { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.player .rbtn { color: #f3e9da; }
.player .play { width: 52px; height: 52px; border-radius: 50%; background: #d4ab6a; color: #241809; }
.player .play:hover { background: #e0bb7f; }
.player .chip { height: 32px; padding: 0 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15); background: transparent; color: #f3e9da; font-size: 13px; font-weight: 600; }
.player select { max-width: 120px; height: 32px; border-radius: 10px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); color: #f3e9da; font-size: 12px; }
.player select option { color: #000; }
.wave { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; margin-right: 6px; vertical-align: -2px; }
.wave i { width: 3px; background: #d4ab6a; border-radius: 2px; animation: wv 1s ease-in-out infinite; }
.wave i:nth-child(2) { animation-delay: .15s; } .wave i:nth-child(3) { animation-delay: .3s; } .wave i:nth-child(4) { animation-delay: .45s; }
@keyframes wv { 0%, 100% { height: 3px; } 50% { height: 14px; } }
.paused .wave i { animation: none; height: 3px; }

.watermark { position: absolute; inset: 0; pointer-events: none; z-index: 2; }

/* Animation d'ouverture */
.flyer { position: fixed; z-index: 80; pointer-events: none; border-radius: 3px 6px 6px 3px; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,.5); }
.flyer img, .flyer .gen { width: 100%; height: 100%; object-fit: cover; }

#toast {
  position: fixed; z-index: 100; left: 50%; bottom: 28px; transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
  padding: 10px 18px; border-radius: 999px; background: #f3e9da; color: #1d1610; font-weight: 500; font-size: 14px;
  transition: .3s cubic-bezier(.2,.8,.2,1); box-shadow: 0 10px 30px rgba(0,0,0,.35); max-width: calc(100vw - 32px); text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 560px) {
  .hero { grid-template-columns: 70px 1fr; gap: 14px; padding: 14px; }
  .hero .mini { width: 70px; }
  .shelf { padding: 20px 10px 0; }
  .plank { margin: 0 -10px; height: 16px; }
  .case { padding: 10px 10px 2px; box-shadow: inset 0 0 0 7px var(--side), inset 0 30px 60px -20px rgba(0,0,0,.6), 0 30px 60px -30px rgba(0,0,0,.7); }
  .top .actions .lbl { display: none; }
  .top .actions .btn { width: 40px; padding: 0; justify-content: center; }
  .top .actions .btn.primary { width: auto; padding: 0 14px; }
  .top .actions .btn.primary .lbl { display: inline; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 560px) { .prose { text-align: left; } }

/* Étiquette sous le livre (format + progression) */
.under { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; z-index: 3; display: flex; justify-content: center; gap: 4px; pointer-events: none; }
.tag { font: 600 8.5px/1 var(--font-ui); letter-spacing: .12em; padding: 3px 6px; border-radius: 4px; background: rgba(22, 13, 6, .78); border: 1px solid rgba(212, 171, 106, .4); color: #d4ab6a; white-space: nowrap; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
.tag.k-pdf { color: #f0a58f; border-color: rgba(240, 165, 143, .45); }
.tag.k-docx { color: #9dbcff; border-color: rgba(157, 188, 255, .45); }
.tag.k-txt { color: #b7d99a; border-color: rgba(183, 217, 154, .45); }
.tag.pct { color: #f3e9da; border-color: rgba(255,255,255,.18); letter-spacing: .06em; }
@media (max-width: 560px) { .under { margin-top: 2px; } .tag { font-size: 7.5px; padding: 2px 5px; } }

/* Couvertures générées (docx / texte) */
.gen { position: relative; isolation: isolate; }
@supports (background: color-mix(in srgb, red, blue)) {
  .gen { background:
    radial-gradient(120% 70% at 85% 0%, rgba(255,255,255,.18), transparent 60%),
    linear-gradient(165deg, color-mix(in srgb, var(--c) 84%, #fff), var(--c) 46%, color-mix(in srgb, var(--c) 66%, #000)); }
}
.gen .deco { position: absolute; inset: 0; z-index: -1; color: #f6ecd8; pointer-events: none; }
.gen .deco svg { display: block; width: 100%; height: 100%; }
.gen .mid { position: relative; }
.gen.v1 { padding: 20% 18% 16% 22%; }
.gen.v1 .t { text-align: center; }
.gen.v1 .rule { margin-left: auto; margin-right: auto; }
.gen.v1 .a, .gen.v1 .orn { text-align: center; }
.gen.v2 .mid { margin-top: -6%; }
.tag.pct { position: static; left: auto; bottom: auto; transform: none; font-size: 8.5px; }
@media (max-width: 560px) { .tag.pct { font-size: 7.5px; } }

/* ---- Lecteur : gestes fiables + texte qui tient dans l'écran ---- */
.reader { touch-action: pan-y; overscroll-behavior: none; }
.reader.zooming { touch-action: auto; }
.page.reflow { padding: var(--pt, 72px) var(--px, 22px) var(--pb, 90px); overflow: hidden; justify-content: center; align-items: flex-start; }
.prose.reflow { padding: 0; margin: 0 auto; max-width: none; }
.prose.reflow > :last-child { margin-bottom: 0; }
.prose p.cont { text-indent: 0; }
.prose.reflow .hd { margin-top: 1.1em; }
.prose.reflow .hd:first-child { margin-top: 0; }

/* ---- Vue liste ---- */
.blist { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
.brow { display: flex; gap: 14px; align-items: stretch; text-align: left; width: 100%; padding: 12px; border-radius: 18px; border: 1px solid var(--glass-line); background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: transform .2s, border-color .2s; }
.brow:hover { transform: translateY(-2px); border-color: var(--brass); }
.brow:active { transform: scale(.985); }
.brow .thumb { width: 74px; flex: none; align-self: center; }
.brow .thumb .cover img { max-height: 120px; }
.binfo { min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.btitle { font: 600 17px/1.2 var(--font-display); overflow-wrap: anywhere; }
.bsub { color: var(--ink-2); font-size: 13px; }
.bbar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 4px 0 2px; }
.bbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brass-2), var(--brass)); }
.bmeta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.blast { font-size: 12px; color: var(--brass); }
.blist.organize .brow { outline: 1px dashed var(--brass); }

/* Dossier source */
.btn.refresh.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.up .bar i.indet { width: 35% !important; animation: indet 1.2s ease-in-out infinite; }
@keyframes indet { from { margin-left: -35%; } to { margin-left: 100%; } }
.sheet .hint a { color: var(--brass); }

/* ===== Rayons : menu latéral, tri, favoris, collections ===== */
.brand-row { display: flex; align-items: center; gap: 12px; }
.menu-btn { flex: none; }
.navline { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; }
.navline b { color: var(--brass); font-weight: 600; }
.crumb { display: inline-flex; align-items: center; gap: 3px; border: 0; background: none; color: var(--ink-2); font: inherit; letter-spacing: inherit; text-transform: inherit; padding: 2px 4px; border-radius: 6px; cursor: pointer; }
.crumb svg { width: 14px; height: 14px; }
.crumb:hover { color: var(--ink); }
.toolbar { flex-wrap: wrap; }
.toolbar .search { min-width: 0; flex: 1 1 180px; }
.sortsel { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 4px 0 12px; border-radius: 12px; border: 1px solid var(--glass-line); background: var(--glass); font-size: 13px; color: var(--ink-3); }
.sortsel select { border: 0; background: transparent; color: var(--ink); font: 500 13px var(--font-ui); height: 100%; outline: none; padding-right: 4px; }
.sortsel select option { background: var(--panel); color: var(--ink); }
.shelf-label { position: relative; z-index: 3; display: flex; align-items: baseline; gap: 8px; padding: 18px 12px 0; font: italic 600 19px/1.2 var(--font-display); color: #f0e2c8; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.shelf-label em, .group-h em { font: 500 12px var(--font-ui); font-style: normal; color: var(--ink-3); }
.group-h { display: flex; align-items: baseline; gap: 8px; font: italic 600 20px/1.2 var(--font-display); margin: 22px 2px 10px; }
.fav-badge { position: absolute; z-index: 4; left: 6px; top: 6px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: rgba(22, 13, 6, .78); color: #f2c14e; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
.fav-badge svg { width: 14px; height: 14px; }
.tag.st { color: #e7d3ff; border-color: rgba(231, 211, 255, .4); letter-spacing: .06em; }
.tstar { display: inline-block; vertical-align: -2px; margin-right: 5px; color: #f2c14e; }
.tstar svg { width: 15px; height: 15px; }
.brow { cursor: pointer; }
.qbar { display: flex; gap: 2px; margin-top: 8px; margin-left: -8px; }
.qb { width: 40px; height: 36px; display: grid; place-items: center; border: 0; background: none; color: var(--ink-3); border-radius: 10px; cursor: pointer; }
.qb svg { width: 21px; height: 21px; }
.qb:hover { background: var(--glass); color: var(--ink); }
.qb.on { color: var(--brass); }
.qbar.big { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 16px; }
.qbar.big .qb { width: auto; height: auto; padding: 10px 4px; gap: 5px; border: 1px solid var(--line); background: var(--panel-2); font: 500 12px var(--font-ui); color: var(--ink-2); }
.qbar.big .qb.on { color: var(--brass); border-color: var(--brass); }
.checks { display: grid; gap: 2px; margin-top: 10px; max-height: 45vh; overflow: auto; }
.check { display: flex; align-items: center; gap: 12px; padding: 12px 6px; border-bottom: 1px solid var(--line); font-size: 16px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--brass); }
.newcol { display: flex; gap: 8px; }
.newcol input { flex: 1; min-width: 0; height: 42px; border-radius: 12px; padding: 0 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); font: inherit; outline: none; }
.newcol input:focus { border-color: var(--brass); }
.authors { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.author { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-align: left; cursor: pointer; font: inherit; }
.author:hover { border-color: var(--brass); }
.author .ini { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); color: var(--brass); font: italic 600 20px var(--font-display); }
.author .aname { font: 600 16px/1.25 var(--font-display); overflow-wrap: anywhere; }
.author em { font-style: normal; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.drawer-scrim { place-items: stretch start; }
.drawer { width: min(320px, 86vw); height: 100%; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 18px 10px calc(18px + env(safe-area-inset-bottom)); box-shadow: 20px 0 60px rgba(0,0,0,.5); animation: slidein .22s cubic-bezier(.2,.8,.2,1); }
@keyframes slidein { from { transform: translateX(-100%); } }
.dhead { display: flex; align-items: center; gap: 12px; padding: 4px 10px 16px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
.dhead b { font: italic 600 20px var(--font-display); }
.dmark { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--brass); color: #1b120a; font-size: 20px; }
.ditem-row { display: flex; align-items: center; }
.ditem { flex: 1; display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 16px; min-height: 48px; padding: 0 12px; border: 0; border-radius: 12px; background: none; color: var(--ink); font: 500 15px var(--font-ui); text-align: left; cursor: pointer; }
.ditem svg { width: 22px; height: 22px; color: var(--ink-3); }
.ditem em { font-style: normal; font-size: 12px; color: var(--ink-3); }
.ditem:hover { background: var(--glass); }
.ditem.sel { background: var(--glass); color: var(--brass); }
.ditem.sel svg { color: var(--brass); }
.ditem.add { width: 100%; color: var(--ink-2); grid-template-columns: 24px 1fr; }
.dedit { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; color: var(--ink-3); border-radius: 10px; cursor: pointer; }
.dedit svg { width: 16px; height: 16px; }
.dsec { padding: 16px 12px 6px; font: 600 11px var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.dline { height: 1px; background: var(--line); margin: 10px 4px; }

/* Bibliothèques */
html, body, .room { transition: background-color .5s ease; }
.libswitch { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: inherit; padding: 0; cursor: pointer; text-align: left; min-width: 0; }
.libswitch h1 { margin: 0; overflow-wrap: anywhere; }
.libswitch > svg { width: 22px; height: 22px; color: var(--ink-3); flex: none; margin-top: 6px; }
.libs { display: grid; gap: 6px; }
.librow { display: flex; align-items: center; gap: 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-2); }
.librow.sel { border-color: var(--brass); }
.libpick { flex: 1; min-width: 0; display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 12px; padding: 12px; border: 0; background: none; color: var(--ink); text-align: left; cursor: pointer; font: inherit; }
.libtxt { min-width: 0; display: grid; gap: 2px; }
.libtxt b { font: 600 16px/1.2 var(--font-display); overflow-wrap: anywhere; }
.libtxt small { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.libpick em { font-style: normal; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.libsw { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(180deg, transparent 62%, var(--sw) 62%, var(--sw) 78%, transparent 78%), color-mix(in srgb, var(--sw) 35%, #111); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); flex: none; }
.libsw.all { background: conic-gradient(#6d4427 0 25%, #3e5566 0 50%, #7a2f22 0 75%, #cfa977 0); }
.decors { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.decor { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2); font: 500 13px var(--font-ui); cursor: pointer; }
.decor .libsw { width: 22px; height: 22px; border-radius: 6px; }
.decor.sel { border-color: var(--brass); color: var(--ink); }
button.dhead { width: 100%; border-left: 0; border-right: 0; border-top: 0; background: none; color: var(--ink); cursor: pointer; text-align: left; font: inherit; }
.dlib { flex: 1; min-width: 0; display: grid; gap: 2px; }
.dlib b { font: italic 600 19px/1.15 var(--font-display); overflow-wrap: anywhere; }
.dlib small { font-size: 12px; color: var(--ink-3); }
button.dhead > svg { width: 20px; height: 20px; color: var(--ink-3); transform: rotate(-90deg); }
.field select { height: 42px; }

/* Petites icônes sous les livres de l'étagère */
.shelf { padding-top: 40px; }
.case { padding-bottom: 32px !important; }
.tiny { position: absolute; left: 0; right: 0; top: calc(100% + 24px); z-index: 3; display: flex; justify-content: center; gap: 1px; }
.ti { width: 22px; height: 20px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-3); opacity: .55; cursor: pointer; transition: opacity .15s, color .15s; }
.ti svg { width: 13px; height: 13px; stroke-width: 2; }
.ti:hover, .ti:focus-visible { opacity: 1; color: var(--ink); outline: none; }
.ti.on { opacity: 1; color: var(--brass); }
.ti:first-child.on { color: #f2c14e; }
@media (max-width: 560px) { .shelf { padding-top: 36px; } .tiny { top: calc(100% + 19px); } .ti { width: 20px; } .ti svg { width: 12px; height: 12px; } }

/* Onglets des bibliothèques */
.libtabs { display: flex; gap: 8px; overflow-x: auto; margin: -10px -16px 18px; padding: 2px 16px 6px; scrollbar-width: none; }
.libtabs::-webkit-scrollbar { display: none; }
.libtab { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 8px; border-radius: 19px; border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink-2); font: 500 14px var(--font-ui); cursor: pointer; white-space: nowrap; max-width: 220px; }
.libtab span:last-child { overflow: hidden; text-overflow: ellipsis; }
.libtab .libsw { width: 22px; height: 22px; border-radius: 50%; }
.libtab.sel { border-color: var(--brass); color: var(--ink); background: var(--panel-2); box-shadow: 0 0 0 1px var(--brass) inset; }
.libtab.add { padding: 0 14px 0 10px; color: var(--brass); border-style: dashed; }
.libtab.add svg { width: 16px; height: 16px; }
/* Feuille des dossiers */
.srcbox { display: grid; gap: 12px; padding: 14px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
.srcname { display: flex; gap: 12px; align-items: flex-start; }
.srcname > svg { width: 26px; height: 26px; color: var(--brass); flex: none; margin-top: 2px; }
.srcname span { display: grid; gap: 3px; min-width: 0; }
.srcname b { font-size: 17px; overflow-wrap: anywhere; }
.srcname small { font-size: 12px; color: var(--ink-3); }
.srcbox .btn { justify-self: start; }
.addsrc { margin-top: 16px; padding: 14px; border-radius: 14px; border: 1px dashed var(--brass); }
.addsrc p { margin: 0 0 12px; color: var(--ink-2); font-size: 14px; }
.more { margin-top: 16px; color: var(--ink-3); font-size: 13px; }
.more summary { cursor: pointer; padding: 4px 0; }

/* Actions du livre, résumé IA */
.bookacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; margin: 0 0 12px; }
.bact { display: grid; justify-items: center; gap: 6px; padding: 12px 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); font: 600 13px var(--font-ui); cursor: pointer; }
.bact svg { width: 22px; height: 22px; color: var(--brass); }
.bact.on { border-color: var(--brass); }
.aiopt { padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-2); margin-bottom: 12px; }
.aiopt h4 { margin: 0 0 6px; font: 600 16px var(--font-display); }
.aiopt p { margin: 0 0 12px; font-size: 14px; color: var(--ink-2); line-height: 1.45; }
.aiopt .field { margin-bottom: 10px; }
.prof-ask { display: flex; gap: 8px; align-items: flex-end; }
.prof-ask textarea { flex: 1; min-height: 64px; resize: vertical; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 15px/1.4 var(--font-ui); }
.prof-answer { margin: 12px 0 0; padding: 12px 14px; border-left: 3px solid var(--brass); background: var(--panel); border-radius: 0 12px 12px 0; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
.prof-row { display: flex; flex-wrap: wrap; gap: 8px; }
.sumtext { font: 16px/1.6 var(--font-read); max-height: 62vh; overflow-y: auto; padding-right: 4px; }
.sumtext h4 { font: 600 17px/1.3 var(--font-display); margin: 18px 0 6px; color: var(--brass); }
.sumtext h4:first-child { margin-top: 4px; }
.sumtext p { margin: 0 0 10px; }
.sumtext ul, .sumtext ol { margin: 0 0 10px; padding-left: 22px; }
.sumtext li { margin-bottom: 4px; }
.ti:last-child { opacity: .45; }
.sumtext h4 + h4 { margin-top: 8px; }
.sumtext h5 { font: 600 14px/1.3 var(--font-ui); margin: 12px 0 4px; color: var(--ink-2); }

/* Sauts dans la lecture audio */
.jumps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
.jump { height: 34px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); color: #d9ccb9; font: 600 12px var(--font-ui); white-space: nowrap; padding: 0 2px; cursor: pointer; }
.jump.fwd { color: #f3e9da; border-color: rgba(212,171,106,.45); }
.jump:active { background: rgba(212,171,106,.25); }
/* Phrases clés du résumé */
.sumtext h4.keyh { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }
.sumtext ul.keys, .sumtext ol.keys { list-style: none; padding: 0; display: grid; gap: 8px; }
.sumtext ul.keys li, .sumtext ol.keys li { margin: 0; padding: 10px 14px; border-left: 3px solid var(--brass); background: var(--panel-2); border-radius: 0 10px 10px 0; font: italic 600 16px/1.4 var(--font-display); }

/* Télé : la télécommande doit toujours montrer où l'on est */
.tv :focus { outline: 3px solid var(--brass); outline-offset: 3px; }
.tv .book:focus { transform: translateY(-10px); outline: none; }
.tv .book:focus .cover { box-shadow: 0 0 0 4px var(--brass), 10px 16px 22px -6px rgba(0,0,0,.6); }

/* Vidéo sur la télé : liste des appareils Google Cast */
button.librow { width: 100%; padding: 10px 12px; gap: 12px; text-align: left; color: inherit; font: inherit; cursor: pointer; }
button.librow small { display: block; color: var(--ink-3); font-size: 13px; }

/* ---------- Menu « Ajouter » ---------- */
.addgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .addgrid { grid-template-columns: 1fr; } }
.addbig { display: flex; gap: 14px; align-items: flex-start; text-align: left; padding: 16px; border-radius: 18px; border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink); cursor: pointer; transition: transform .15s, border-color .2s; }
.addbig:hover, .addbig:active { border-color: var(--brass); transform: translateY(-1px); }
.addic { flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--brass); color: var(--brass-ink, #241809); }
.addic svg { width: 24px; height: 24px; }
.addtx b { display: block; font: 600 17px/1.25 var(--font-display); margin-bottom: 4px; }
.addtx small { display: block; color: var(--ink-2); font-size: 13px; line-height: 1.4; }
.addrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.addsmall { flex: 1 1 0; min-width: 120px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 10px; border-radius: 14px; border: 1px solid var(--glass-line); background: transparent; color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer; }
.addsmall svg { width: 18px; height: 18px; opacity: .8; }
.addsmall:hover { border-color: var(--brass); }
.addfind { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 16px; padding: 12px 14px; border-radius: 14px; border: 1px dashed var(--glass-line); background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.addfind > svg { width: 22px; height: 22px; flex: none; color: var(--brass); }
.addfind > svg:last-child { width: 16px; height: 16px; color: var(--ink-3); }
.addfind span { flex: 1; }
.addfind b { display: block; font-size: 15px; }
.addfind small { color: var(--ink-2); font-size: 12.5px; }
/* ---------- Catalogues ---------- */
.catlist { display: flex; flex-direction: column; gap: 6px; }
.catrow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink); text-align: left; cursor: pointer; }
.catrow:hover { border-color: var(--brass); }
.catrow > svg { width: 16px; height: 16px; color: var(--ink-3); flex: none; }
.catbadge { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; font: 700 13px/1 Inter, sans-serif; letter-spacing: .02em; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.cattx { flex: 1; min-width: 0; }
.cattx b { display: block; font-size: 15px; }
.cattx small { display: block; color: var(--ink-2); font-size: 12.5px; }
.catbuy { margin-top: 12px; }
.btn.on { border-color: var(--brass); }
/* ---------- Voix et ton ---------- */
.vh { font: 600 13px/1 Inter, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 6px 0 10px; }
.vh + .tonegrid { margin-bottom: 18px; }
.tonegrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 520px) { .tonegrid { grid-template-columns: repeat(2, 1fr); } }
.tonecard { text-align: left; padding: 12px; border-radius: 14px; border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink); cursor: pointer; }
.tonecard b { display: block; font: 600 16px/1.2 var(--font-display); margin-bottom: 3px; }
.tonecard small { display: block; color: var(--ink-2); font-size: 12px; line-height: 1.35; }
.tonecard.sel { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
.vlist { display: flex; flex-direction: column; gap: 4px; }
.vrow { display: flex; align-items: center; gap: 6px; border-radius: 16px; padding: 4px 6px 4px 4px; border: 1px solid transparent; }
.vrow.sel { border-color: var(--brass); background: var(--glass); }
.vpick { flex: 1; display: flex; align-items: center; gap: 14px; padding: 8px; background: transparent; border: 0; color: var(--ink); text-align: left; cursor: pointer; min-width: 0; }
.orb { flex: none; width: 46px; height: 46px; border-radius: 50%; box-shadow: inset -4px -6px 12px rgba(0,0,0,.35), inset 3px 4px 10px rgba(255,255,255,.25); }
.vtx b { display: block; font-size: 16px; }
.vtx small { display: block; color: var(--ink-2); font-size: 12.5px; }
.player .chip svg { width: 15px; height: 15px; vertical-align: -3px; }
svg.rot-r { transform: rotate(-90deg); }

/* Panneau de progression (conversion en texte) */
.scanpanel { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 60; max-width: 520px; margin: 0 auto; padding: 14px 16px; border-radius: 18px; background: var(--panel, #221a14); border: 1px solid var(--glass-line); box-shadow: 0 18px 50px rgba(0,0,0,.45); color: var(--ink); }
.scanpanel b { display: block; font: 600 16px/1.2 var(--font-display); margin-bottom: 4px; }
.scanpanel > span { display: block; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.scanpanel .bar { height: 6px; border-radius: 4px; background: rgba(255,255,255,.08); margin: 10px 0 6px; overflow: hidden; }
.scanpanel .bar i { display: block; height: 100%; background: var(--brass); border-radius: 4px; transition: width .3s; }
.scanpanel.paused .bar i { opacity: .45; }
.scanpanel .actions { margin-top: 10px; justify-content: flex-end; }

/* Minuterie, prononciation */
.player .chips { display: flex; gap: 6px; }
.player .chip.sleep.on { border-color: #d4ab6a; color: #e8c88f; }
.sleepgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sleepgrid .btn { justify-content: center; }
.pronadd { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 6px; margin: 12px 0; }
@media (max-width: 460px) { .pronadd { grid-template-columns: 1fr 1fr; } }
.pronlist { display: flex; flex-direction: column; gap: 4px; }
.pronrow { display: flex; align-items: center; gap: 6px; padding: 6px 4px 6px 12px; border-radius: 12px; border: 1px solid var(--glass-line); }
.pronrow span { flex: 1; }

/* Appui long : définition */
.reader.looking .tapzone, .reader.looking .r-top, .reader.looking .r-bottom { pointer-events: none; }
.lookmark { position: fixed; z-index: 6; border-radius: 4px; background: rgba(212,171,106,.32); pointer-events: none; }
.lookup { position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 8; max-width: 560px; margin: 0 auto; max-height: 58vh; overflow: auto; padding: 12px 14px 14px; border-radius: 18px; background: #1d1611; color: #f1e7d6; box-shadow: 0 18px 50px rgba(0,0,0,.45); font-size: 14.5px; line-height: 1.45; user-select: text; -webkit-user-select: text; }
.lookhead { display: flex; align-items: center; gap: 4px; }
.lookhead b { font: 600 22px/1.2 var(--font-display); }
.lookhead .grow { flex: 1; }
.lookup .rbtn { color: #f1e7d6; }
.lookbody p, .looktr p { margin: 4px 0 8px; }
.lookpos { display: block; margin-top: 8px; font: 600 11px/1 Inter, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: #d4ab6a; }
.looklemma { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.1); }
.looklemma > b { font: 600 17px/1.2 var(--font-display); }
.looktr small { display: block; margin-top: 8px; font: 600 11px/1 Inter, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: #8fc1d9; }
.looktr p { font-style: italic; }
.lookacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.lookacts .btn { font-size: 13px; padding: 7px 12px; }
.lookup .muted { color: #a8987f; }

/* Vitesse de lecture, toujours visible dans le lecteur */
.speedrow { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 6px; border-radius: 14px; background: rgba(255,255,255,.05); }
.splbl { font-size: 12px; color: #b9a888; padding-left: 6px; }
.spcats { display: flex; flex: 1; gap: 4px; }
.spcat { flex: 1; height: 36px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: transparent; color: #f3e9da; font-size: 14px; font-weight: 600; }
.spcat.sel { background: #d4ab6a; border-color: #d4ab6a; color: #241809; }
.spfine { display: flex; align-items: center; gap: 2px; }
.spbtn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: transparent; color: #f3e9da; font-size: 22px; line-height: 1; }
.spval { min-width: 56px; text-align: center; font-size: 16px; color: #f3e9da; font-variant-numeric: tabular-nums; }
@media (max-width: 400px) { .splbl { display: none; } .spval { min-width: 48px; } }

.gotbook { display: flex; gap: 14px; align-items: center; }
.gotbook .cover { width: 72px; flex: none; aspect-ratio: 2 / 3; }
.gotbook b { display: block; font: 600 18px/1.25 var(--font-display); }
.gotbook small { display: block; color: var(--ink-2); margin-top: 3px; }

/* Livres audio */
.audiobook { background: radial-gradient(120% 80% at 50% 0%, #2a2018 0%, #0f0c0a 70%); color: #f1e7d6; }
.audiobook .r-top { background: transparent; border: 0; backdrop-filter: none; -webkit-backdrop-filter: none; color: #f1e7d6; }
.abmain { flex: 1; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: 78px 20px calc(24px + env(safe-area-inset-bottom)); gap: 10px; }
.abcover { width: min(62vw, 300px); }
.abcover .cover { width: 100%; aspect-ratio: 2 / 3; box-shadow: 0 24px 60px rgba(0,0,0,.6); border-radius: 6px; overflow: hidden; }
.abtitle { text-align: center; margin-top: 10px; }
.abtitle b { display: block; font: 600 22px/1.25 var(--font-display); }
.abtitle span { color: #b9a888; font-size: 14px; }
.abchap { color: #d4ab6a; font-size: 13px; text-align: center; min-height: 1.3em; }
.abseek { width: 100%; max-width: 520px; }
.abseek input { width: 100%; accent-color: #d4ab6a; }
.abtimes { display: flex; justify-content: space-between; font-size: 12px; color: #b9a888; font-variant-numeric: tabular-nums; }
.ableft { font-size: 12px; color: #8a7a66; }
.abctl { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 4px 0; }
.abctl .rbtn { color: #f1e7d6; }
.abplay { width: 72px; height: 72px; border-radius: 50%; border: 0; background: #d4ab6a; color: #241809; display: grid; place-items: center; }
.abplay svg { width: 30px; height: 30px; }
.abjump { width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,.15); background: transparent; color: #f1e7d6; font-weight: 700; font-size: 15px; display: grid; place-items: center; line-height: 1; }
.abjump small { font-size: 10px; font-weight: 500; opacity: .7; margin-top: -10px; }
.audiobook .speedrow { width: 100%; max-width: 520px; }
.abchips { display: flex; gap: 8px; }
.abchips .chip { height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15); background: transparent; color: #f3e9da; font-size: 13px; font-weight: 600; }
.abchips .chip svg { width: 15px; height: 15px; vertical-align: -3px; }
.abchips .chip.sleep.on { border-color: #d4ab6a; color: #e8c88f; }
.chaplist { display: flex; flex-direction: column; gap: 2px; max-height: 60vh; overflow: auto; }
.chaprow { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); text-align: left; }
.chaprow.sel { background: var(--glass); box-shadow: inset 3px 0 0 var(--brass); }
.chapn { width: 28px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.chapt { flex: 1; }
.chapd { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }

/* Ranger dans une bibliothèque */
.libchips { display: flex; flex-wrap: wrap; gap: 8px; }
.libchip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 10px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer; }

.qb.hot { color: var(--brass) !important; opacity: 1 !important; }
.webnote { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 14px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink-2); font-size: 14px; }
.webnote > svg { width: 22px; height: 22px; color: var(--brass); flex: none; }
.webnote > span { flex: 1; min-width: 180px; }

/* Lire québécois */
.qcbox { margin: 6px 0 4px; padding: 14px; border-radius: 18px; background: linear-gradient(160deg, rgba(0,51,153,.28), rgba(0,51,153,.08)); border: 1px solid rgba(120,160,255,.18); }
.qchead { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.qchead b { display: block; font: 600 19px/1.2 var(--font-display); color: var(--ink); }
.qchead small { color: var(--ink-2); font-size: 13px; }
.qcflag { width: 36px; height: 24px; border-radius: 4px; flex: none; background:
  radial-gradient(circle at 25% 28%, #fff 0 3px, transparent 3.5px), radial-gradient(circle at 75% 28%, #fff 0 3px, transparent 3.5px),
  radial-gradient(circle at 25% 74%, #fff 0 3px, transparent 3.5px), radial-gradient(circle at 75% 74%, #fff 0 3px, transparent 3.5px),
  linear-gradient(#fff, #fff) center / 100% 5px no-repeat, linear-gradient(#fff, #fff) center / 5px 100% no-repeat, #003da5; }
.qcrow { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
.qcbook { flex: none; width: 92px; scroll-snap-align: start; border: 0; background: transparent; color: var(--ink); text-align: left; padding: 0; cursor: pointer; }
.qcbook .cover { width: 92px; aspect-ratio: 2 / 3; border-radius: 4px; overflow: hidden; box-shadow: 0 8px 18px rgba(0,0,0,.35); }
.qcbook > span { display: block; margin-top: 6px; font-size: 12px; line-height: 1.25; color: var(--ink-2); }

.qclinks .btn { font-size: 13px; padding: 7px 12px; }

/* Trouver des livres : les livres dans l'application */
.fsearch { display: flex; gap: 8px; margin-bottom: 14px; }
.fsearch input { flex: 1; min-width: 0; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px 10px; }
.fbook { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fbook .cover { width: 100%; aspect-ratio: 2 / 3; border-radius: 4px; overflow: hidden; box-shadow: 0 8px 18px rgba(0,0,0,.35); }
.fbook .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fbook b { font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fbook small { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fbook .btn { margin-top: auto; justify-content: center; font-size: 13px; padding: 6px 8px; }
.qcrow .qcitem { flex: none; width: 104px; scroll-snap-align: start; }
.catrow.pending { opacity: .45; pointer-events: none; }

.fcats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; -webkit-overflow-scrolling: touch; }
.fcat { flex: none; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink); font-size: 13.5px; font-weight: 500; }
.fcat.sel { background: var(--brass); border-color: var(--brass); color: var(--brass-ink, #241809); }
.qcitem.pending { opacity: .5; pointer-events: none; }

/* Boîtes de progression (Professeur, ajouts…) : jamais plus larges que l'écran */
.uploads > * { min-width: 0; max-width: 100%; box-sizing: border-box; }
.up span, .up small { display: block; overflow-wrap: anywhere; }
.up .prof-row { flex-wrap: wrap; }
.up .prof-row .btn { flex: 1 1 auto; justify-content: center; min-width: 0; padding-left: 10px; padding-right: 10px; }
@media (max-width: 560px) { .uploads { left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); width: auto; } }

/* Options d'un livre : bouton ⋮ doré, bulle de découverte, titre limité à deux lignes */
.ti.more { color: var(--brass); opacity: .95; }
.ti.hot { color: var(--brass); opacity: 1; }
.sheet-head h2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.coach { position: absolute; z-index: 65; padding: 14px 16px 12px; border-radius: 16px; background: #f6efe1; color: #2c241b; box-shadow: 0 18px 50px rgba(0,0,0,.45); animation: coachIn .35s cubic-bezier(.2,.8,.2,1); }
.coach b { display: block; font: 600 16px/1.25 var(--font-display); margin-bottom: 4px; }
.coach p { margin: 0; font-size: 13.5px; line-height: 1.45; color: #4a3d30; }
.coachdots { display: inline-grid; place-items: center; width: 20px; height: 18px; border-radius: 5px; background: #e6d8bd; vertical-align: -4px; color: #8a5a1c; }
.coachdots svg { width: 14px; height: 14px; }
.coachact { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
.coachact .btn { font-size: 13px; padding: 6px 14px; }
.coach .btn:not(.primary) { background: transparent; color: #4a3d30; border-color: rgba(0,0,0,.15); }
.coach::before { content: ''; position: absolute; left: calc(var(--ax) - 8px); width: 16px; height: 16px; background: #f6efe1; transform: rotate(45deg); }
.coach.down::before { top: -7px; }
.coach.up::before { bottom: -7px; }
.book.coached .cover { animation: coachPulse 1.6s ease-in-out 3; }
@keyframes coachIn { from { opacity: 0; transform: translateY(6px); } }
@keyframes coachPulse { 50% { box-shadow: 0 0 0 4px rgba(212,171,106,.55), 0 10px 26px rgba(0,0,0,.4); } }

/* Zoom fluide des PDF */
.reader.pdf-mode { touch-action: none; }
.reader.pdf-mode .page.pdf { will-change: transform; backface-visibility: hidden; }
.reader.zoomed .tapzone { pointer-events: none; }

/* Texte ⇄ Photo */
.viewchip { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid currentColor; background: transparent; color: inherit; font-size: 13px; font-weight: 600; opacity: .9; }
.player .cap .chip { margin-left: 6px; height: 28px; padding: 0 10px; border-radius: 9px; border: 1px solid #d4ab6a; background: #d4ab6a; color: #241809; font: 600 12px Inter, sans-serif; }

.sharechoices { display: grid; gap: 10px; margin-top: 14px; }

.status-pill.bait { background: #a8322a; color: #fff; }

/* Pages de texte « comme un livre » : justifié, retrait sans espace entre paragraphes, titres centrés, lettrine,
   titre courant en haut, numéro en bas, légère ombre de reliure */
.page.reflow { background: linear-gradient(90deg, rgba(60,40,20,.10), rgba(60,40,20,0) 4%, rgba(60,40,20,0) 96%, rgba(60,40,20,.05)), var(--paper); }
.reader[data-theme="nuit"] .page.reflow { background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,0) 4%), var(--paper); }
.prose.reflow { line-height: 1.62; text-align: justify; hyphens: auto; -webkit-hyphens: auto; text-rendering: optimizeLegibility; font-variant-ligatures: common-ligatures; }
.prose.reflow p { margin: 0; text-indent: 1.6em; }
.prose.reflow p.cont, .prose.reflow .hd + p, .prose.reflow p:first-child { text-indent: 0; }
.prose.reflow .hd { text-align: center; margin: 1.3em 0 .9em; line-height: 1.3; }
.prose.reflow .hd:first-child { margin-top: .2em; }
.prose.reflow .hd.caps { font: 600 .9em/1.4 var(--font-read); letter-spacing: .09em; }
.prose.reflow .hd + p::first-letter { float: left; font: 600 3.1em/.82 var(--font-display); padding: .06em .08em 0 0; color: #9a6a2c; }
.reader[data-theme="nuit"] .prose.reflow .hd + p::first-letter { color: #c9a06a; }
.page.reflow .runhead { position: absolute; left: 0; right: 0; top: calc(var(--pt, 72px) - 30px); text-align: center; font: 500 11px/1 var(--font-read); font-variant: small-caps; letter-spacing: .12em; text-transform: lowercase; opacity: .5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 60px; pointer-events: none; }
.page.reflow .folio { bottom: calc(var(--pb, 90px) - 30px); font: 12px/1 var(--font-read); opacity: .55; }

/* Livre converti (photo → texte) : page blanche imprimée, comme la photo d'origine */
.reader.print-mode { background: #000; --chrome: rgba(14,14,14,.84); --chrome-ink: #ececec; }
.reader.print-mode .r-top, .reader.print-mode .r-bottom { border-color: rgba(255,255,255,.06); }
.reader.print-mode .stage { background: #000; }
.reader.print-mode .page.reflow { top: var(--st, 0); bottom: auto; height: var(--sh, 100%); width: var(--sw, 100%); left: calc(50% - var(--sw, 100%) / 2); right: auto; box-sizing: border-box; background: #fff; color: #161616; justify-content: flex-start; }
.reader.print-mode .prose.reflow { font-family: Georgia, 'Noto Serif', 'Times New Roman', serif; font-size: calc(var(--fs, 18px) * .86 * var(--dens, 1)); line-height: calc(1.2 + .22 * var(--dens, 1)); color: #161616; text-align: justify; }
.reader.print-mode .prose.reflow p { margin: 0 0 .8em; text-indent: 0; }
.reader.print-mode .prose.reflow .hd, .reader.print-mode .prose.reflow .hd.caps { text-align: left; font: italic 700 1.02em/1.35 Georgia, 'Noto Serif', serif; letter-spacing: 0; margin: 1.1em 0 .45em; color: #111; }
.reader.print-mode .prose.reflow .hd:first-child { margin-top: 0; }
.reader.print-mode .prose.reflow .hd + p::first-letter { float: none; font: inherit; padding: 0; color: inherit; }
.reader.print-mode .page.reflow .runhead { display: none; }
.reader.print-mode .page.reflow .folio { bottom: 12px; font: 11px/1 Georgia, serif; color: #555; opacity: 1; }
.reader.print-mode .curl-flap > div { background: #f4f4f2; }
.reader.print-mode[data-theme="nuit"] .page.reflow { background: #1b1b1b; color: #d6d6d6; }
.reader.print-mode[data-theme="nuit"] .prose.reflow, .reader.print-mode[data-theme="nuit"] .prose.reflow .hd { color: #d6d6d6; }
.reader.print-mode[data-theme="nuit"] .page.reflow .folio { color: #999; }
.reader.print-mode[data-theme="nuit"] .curl-flap > div { background: #2a2a2a; }

/* ---------- Défilement fluide sur téléphone ----------
   Les effets coûteux (flou d'arrière-plan, livres qui se soulèvent au toucher) sont recalculés à chaque image pendant le défilement :
   sur écran tactile on les remplace par des équivalents fixes, et les rayons hors de l'écran ne sont pas dessinés. */
/* Les rayons sont tous dessinés d'avance : les dessiner au moment où ils arrivent à l'écran (content-visibility) faisait sauter le défilement sur Android */
.cover { contain: paint; }
@media (hover: none), (pointer: coarse) {
  .btn, .hero, .brow { backdrop-filter: none; -webkit-backdrop-filter: none; }
  .btn { background: rgba(255,255,255,.07); }
  .btn.primary { background: linear-gradient(180deg, var(--brass), var(--brass-2)); }
  .hero { background: linear-gradient(120deg, rgba(255,255,255,.06), rgba(255,255,255,.015)); }
  .brow { background: rgba(255,255,255,.05); }
  .book, .cover, .ti { transition: none; }
  .case { box-shadow: inset 0 0 0 7px var(--side), inset 0 0 0 8px rgba(0,0,0,.25); }
  .case::before { content: ''; position: absolute; left: 7px; right: 7px; top: 7px; height: 70px; background: linear-gradient(180deg, rgba(0,0,0,.45), transparent); pointer-events: none; z-index: 0; border-radius: 4px 4px 0 0; }
  .plank { box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .plank::after { height: 18px; background: linear-gradient(180deg, rgba(0,0,0,.55), transparent); }
  .cover { box-shadow: 3px 4px 6px -2px rgba(0,0,0,.55); }
  .book:hover, .book:focus-visible, .book:active { transform: none; }
  .book:hover .cover, .book:focus-visible .cover { transform: none; box-shadow: 4px 6px 12px -3px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.4); }
}

/* ---------- Premium ---------- */
.premium p { margin: 0 0 12px; color: var(--ink-2); }
.pfeats { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.pfeat { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--glass-line); }
.pfeat.hi { border-color: var(--brass); background: rgba(212,171,106,.08); }
.pfeat .pic { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(212,171,106,.14); color: var(--brass); }
.pfeat .pic svg { width: 18px; height: 18px; }
.pfeat b { display: block; font-size: 15px; }
.pfeat small { display: block; color: var(--ink-2); font-size: 12.5px; line-height: 1.35; }
.pbuy { display: flex; flex-direction: column; gap: 8px; align-items: stretch; margin-bottom: 12px; }
.pbuy .btn.big { height: 50px; justify-content: center; font-size: 16px; }

.pbadge { display: inline-block; margin-left: 6px; font-size: 11px; color: var(--brass); vertical-align: 2px; }

/* Menu des onglets, confirmation */
.libtab .tabmore { display: inline-flex; margin-left: -2px; opacity: .7; }
.libtab .tabmore svg { width: 14px; height: 14px; }
.addbig.danger .addic, .addbig.danger b { color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: #fff; border-color: transparent; }

/* Sélection de plusieurs livres */
.book.selecting .cover { transition: transform .15s, outline-color .15s; outline: 3px solid transparent; outline-offset: 2px; }
.book.picked .cover { outline-color: var(--brass); transform: scale(.94); }
.selbox { position: absolute; z-index: 6; right: 6px; top: 6px; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: rgba(15, 10, 6, .55); border: 2px solid rgba(255,255,255,.85); color: transparent; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
.selbox svg { width: 15px; height: 15px; stroke-width: 3; }
.picked .selbox { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
.brow.selecting .thumb { position: relative; }
.brow.picked { border-color: var(--brass); }
body.selmode .tiny, body.selmode .qbar { visibility: hidden; }
body.selmode .uploads { bottom: 150px; }
.selbar { position: fixed; z-index: 55; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; padding: 10px 12px 12px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 18px 50px rgba(0,0,0,.55); animation: rise .2s ease-out; }
.selhead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.selhead b { flex: 1; font: 600 15px var(--font-ui); }
.selall { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); border-radius: 10px; padding: 6px 12px; font: 600 13px var(--font-ui); cursor: pointer; }
.selacts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.selact { display: grid; justify-items: center; gap: 4px; padding: 8px 2px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); font: 600 11.5px var(--font-ui); cursor: pointer; }
.selact svg { width: 21px; height: 21px; color: var(--brass); }
.selact.danger svg { color: var(--danger); }
.selact[disabled] { opacity: .38; pointer-events: none; }
.room { padding-bottom: 20px; }
body.selmode .room { padding-bottom: 170px; }
body.selmode #toast { bottom: calc(165px + env(safe-area-inset-bottom)); }
.check.autoscan { margin-top: 12px; border: 1px solid var(--line); border-radius: 14px; padding: 12px; align-items: flex-start; }
.check.autoscan span { display: grid; gap: 3px; } .check.autoscan small { color: var(--ink-3); font-size: 12px; }
.ignored .ignrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); color: var(--ink-2); font-size: 14px; }
.ignored .ignrow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ignored .ignrow .btn { flex: none; height: 34px; }

/* ---------- IA gratuite : les 4 touchers, au-dessus de la page de Google ouverte en bas ---------- */
.kg-panel { position: fixed; left: 0; right: 0; top: 0; height: 36vh; min-height: 250px; z-index: 9999; background: var(--panel); color: var(--ink); padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; font-family: var(--font-ui); }
.kg-head { font-weight: 600; font-size: 14px; opacity: .75; margin-bottom: 4px; }
.kg-step { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.3; padding: 5px 0; border-bottom: 1px solid var(--line); }
.kg-step:last-child { border-bottom: 0; }
.kg-num { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--brass); color: var(--brass-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; margin-top: 1px; }
.kg-chip { display: inline-block; border: 1px solid #c4c7c5; border-radius: 14px; padding: 1px 9px; background: #fff; color: #1f1f1f; font: 500 14px Roboto, Arial, sans-serif; white-space: nowrap; vertical-align: 1px; box-shadow: 0 0 0 2px rgba(217, 48, 37, .6); }
.kg-chip.sq { padding: 2px 4px 0; border-radius: 6px; line-height: 0; }
.kg-chip.x { padding: 3px 7px; line-height: 1; font-weight: 700; }
.kg-where { opacity: .65; font-size: 13px; white-space: nowrap; }
.kg-list { padding-left: 22px; margin: 8px 0; }
.kg-list li { margin: 5px 0; }
.kg-big { font-size: 46px; text-align: center; margin-top: 4px; }
.kg-spin { width: 40px; height: 40px; border: 4px solid var(--line); border-top-color: var(--brass); border-radius: 50%; margin: 18px auto 8px; animation: kgspin .9s linear infinite; }
@keyframes kgspin { to { transform: rotate(360deg); } }

<div id="toast" role="status" aria-live="polite"></div>
<script>
/* Mode local : tout reste dans le navigateur (IndexedDB), aucun serveur. */
'use strict';
window.LocalAPI = (() => {
  const PALETTE = ['#7a2e2e', '#1f4e5f', '#3b5d3a', '#5b3a6b', '#8a5a1c', '#2c3e66', '#6b2d4f', '#355c55', '#7d4b2a', '#3d3d5c'];
  const rid = () => Math.random().toString(36).slice(2, 11) + Date.now().toString(36).slice(-3);
  const now = () => Date.now();

  // ---------- Stockage (IndexedDB, repli en mémoire) ----------
  let dbp = null; const mem = { meta: new Map(), blob: new Map(), prog: new Map() }; let useMem = false;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try {
        const r = indexedDB.open('bibliotheque-locale', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('meta', { keyPath: 'id' }); d.createObjectStore('blob'); d.createObjectStore('prog', { keyPath: 'book' }); };
        r.onsuccess = () => res(r.result);
        r.onerror = r.onblocked = () => { useMem = true; res(null); };
      } catch { useMem = true; res(null); }
    });
    return dbp;
  }
  async function tx(store, mode, fn) {
    const d = await db();
    if (!d) return fn(null, store);
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode); const o = t.objectStore(store); let out;
      Promise.resolve(fn(o, store)).then((v) => { out = v; }).catch(rej);
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
    });
  }
  const rq = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const get = (store, key) => tx(store, 'readonly', (o, s) => o ? rq(o.get(key)) : mem[s].get(key));
  const all = (store) => tx(store, 'readonly', (o, s) => o ? rq(o.getAll()) : [...mem[s].values()]);
  const put = (store, val, key) => tx(store, 'readwrite', (o, s) => { if (!o) { mem[s].set(key ?? val.id ?? val.book, val); return; } return rq(key !== undefined ? o.put(val, key) : o.put(val)); });
  const del = (store, key) => tx(store, 'readwrite', (o, s) => o ? rq(o.delete(key)) : mem[s].delete(key));

  // ---------- pdf.js (embarqué dans le fichier) ----------
  let pdfjsP = null;
  function pdfjs() {
    if (pdfjsP) return pdfjsP;
    pdfjsP = (async () => {
      const dec = (id) => { const b = atob(document.getElementById(id).textContent.trim()); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Blob([u], { type: 'text/javascript' }); };
      let lib, worker;
      const CDN = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/legacy/build/';
      let m = null;
      if (document.getElementById('pdfjs-lib')) {

        h('span', { class: 'addic' }, icon('link')), h('span', { class: 'addtx' }, h('b', {}, 'Envoyer un lien'), h('small', {}, 'Tout se fait seul : la bibliothèque est mise en ligne et tu reçois un lien à texter. La personne l\'ouvre sur son téléphone, et tout s\'ajoute.'))) : null,

async function packLibrary(lib, books, how = 'file') {
  const box = h('div', { class: 'up' }, h('b', {}, `Partage de « ${lib.name} »`), h('span', { class: 'muted' }, 'Préparation…'), h('div', { class: 'bar' }, h('i', { style: { width: '0%' } })));
  $('#uploads')?.append(box);
