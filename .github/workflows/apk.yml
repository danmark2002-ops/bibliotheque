name: Construire l'APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee ../build.log

      - name: Journal d'erreurs (branche build-log)
        if: failure()
        run: |
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          tail -c 60000 build.log > /tmp/build.log
          git checkout --orphan build-log && git rm -rqf . && cp /tmp/build.log build.log
          git add build.log && git commit -qm "Journal de compilation ${{ github.run_number }}" && git push -f origin build-log

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk Bibliotheque.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bibliotheque-APK
          path: Bibliotheque.apk

      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Bibliothèque — APK ${{ github.run_number }}
          body: Télécharge Bibliotheque.apk depuis ton téléphone Android et installe-le.
          files: Bibliotheque.apk
