name: Sonde voix
on:
  push:
    branches: [sonde-voix]
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Voix
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash android/voix.sh > /tmp/voix.txt 2>&1
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Essai sur émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb logcat -c || true
            cd android && (gradle connectedAndroidTest -PessaiVoix --no-daemon > /tmp/test.txt 2>&1; echo "CODE $?" >> /tmp/test.txt) || true
            adb shell settings get secure tts_default_synth > /tmp/eng.txt 2>&1 || true
            adb shell pm list packages | grep -i tts >> /tmp/eng.txt 2>&1 || true
            adb logcat -d -v time > /tmp/logcat.txt 2>&1 || true
      - name: Résultats
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          { tail -60 /tmp/test.txt; echo ==== ENG; cat /tmp/eng.txt; echo ==== LOG; grep -E 'VOIXTEST|VoixInterne|sherpa|TestRunner|AndroidRuntime|FATAL|DEBUG  |libc |TextToSpeech|TtsService|ca.bibliotheque' /tmp/logcat.txt | tail -300; } > /tmp/out.txt 2>&1
          find android/app/build/outputs/androidTest-results -name '*.xml' -exec cat {} \; >> /tmp/out.txt 2>/dev/null || true
          git config user.name b; git config user.email b@b
          git checkout --orphan sonde-log && git rm -rqf . && cp /tmp/out.txt out.txt && git add out.txt && git commit -qm sonde && git push -f origin sonde-log
