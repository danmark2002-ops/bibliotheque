plugins {
    id 'com.android.application'
}

android {
    namespace 'ca.bibliotheque.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ca.bibliotheque.app'
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName '2.3'
    }

    signingConfigs {
        release {
            storeFile file('bibliotheque.jks')
            storePassword 'bibliotheque2026'
            keyAlias 'bibliotheque'
            keyPassword 'bibliotheque2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // IA intégrée au téléphone (Gemini Nano, via AICore) : gratuite, sans Internet, sans compte
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
}
