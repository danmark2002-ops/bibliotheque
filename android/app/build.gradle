plugins {
    id 'com.android.application'
}

android {
    namespace 'ca.bibliotheque.app'
    compileSdk 34

    defaultConfig {
        applicationId 'ca.bibliotheque.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            storeFile file('bibliotheque.jks')
            storePassword 'bibliotheque2026'
            keyAlias 'bibliotheque'
            keyPassword 'bibliotheque2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
