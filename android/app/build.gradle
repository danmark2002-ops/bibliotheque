plugins {
    id 'com.android.application'
}

android {
    namespace 'ca.bibliotheque.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ca.bibliotheque.app'
        minSdk 26
        targetSdk 34
        versionCode 33
        versionName '4.2'
    }

    signingConfigs {
        release {
            storeFile file('bibliotheque.jks')
            storePassword 'bibliotheque2026'
            keyAlias 'bibliotheque'
            keyPassword 'bibliotheque2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // IA intégrée au téléphone (Gemini Nano, via AICore) : gratuite, sans Internet, sans compte
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
    // Google Cast : envoyer une vidéo du Professeur sur la télé en un clic
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
}
