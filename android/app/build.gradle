plugins {
    id 'com.android.application'
}

android {
    namespace 'ca.bibliotheque.app'
    compileSdk 36

    defaultConfig {
        applicationId 'ca.bibliotheque.app'
        minSdk 22 // Fire TV Stick de base (Fire OS 5 = Android 5.1) et téléviseurs plus anciens : les fonctions récentes sont activées selon la version
        targetSdk 36
        versionCode 145
        versionName '10.54'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            storeFile file('bibliotheque.jks')
            storePassword 'bibliotheque2026'
            keyAlias 'bibliotheque'
            keyPassword 'bibliotheque2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // Voix française intégrée : le modèle est lu tel quel (non compressé) ; les bibliothèques x86 du moteur sont retirées
    // (aucun téléviseur ni téléphone visé n'est x86 : elles doubleraient la taille de l'APK)
    androidResources {
        noCompress 'onnx'
    }
    packaging {
        jniLibs {
            // le moteur n'utilise que libsherpa-onnx-jni et libonnxruntime (vérifié : readelf) ; x86 retiré (aucun appareil visé)
            // (sauf pour l'essai sur émulateur x86_64 : -PessaiVoix)
            excludes += ['lib/*/libsherpa-onnx-c-api.so', 'lib/*/libsherpa-onnx-cxx-api.so']
            if (!project.hasProperty('essaiVoix'))
                excludes += ['lib/x86/libonnxruntime.so', 'lib/x86/libsherpa-onnx-jni.so', 'lib/x86_64/libonnxruntime.so', 'lib/x86_64/libsherpa-onnx-jni.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Version Premium : paiement unique par Google Play (version 8 ou plus exigée par Google depuis le 31 août 2026)
    implementation 'com.android.billingclient:billing:8.0.0'
    // IA intégrée au téléphone (Gemini Nano, via AICore) : gratuite, sans Internet, sans compte
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
    // Reconnaissance du texte des pages photographiées : sur le téléphone, sans Internet
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    // Google Cast : envoyer une vidéo du Professeur sur la télé en un clic
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
    // Page de Google pour la clé IA gratuite, ouverte en panneau sous les instructions
    implementation 'androidx.browser:browser:1.8.0'
    // Voix française hors ligne (Fire TV sans voix française) : sherpa-onnx 1.13.8, Apache 2.0 — l'AAR est téléchargé par la compilation (apk.yml)
    implementation files('libs/sherpa-onnx.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    // essai de la voix sur émulateur (android/app/src/androidTest)
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
